<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Capilar | Catálogo de Próteses Profissionais</title>
    <meta name="description" content="Catálogo completo de próteses capilares profissionais. Micropele, Lace, Híbrida e muito mais. Conheça nossos modelos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
        <!-- Ícone da Lua (Aparece no tema claro para mudar pro escuro) -->
        <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <!-- Ícone do Sol (Aparece no tema escuro para mudar pro claro) -->
        <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <header class="main-header">
        <div class="header-glow"></div>
        <div class="container">
            <h1>Rafael Muller <span class="highlight">Prótese Capilar</span></h1>
            <p>Especialistas em Prótese de Alta Performance</p>
        </div>
    </header>

    <main class="container">
        <section class="filters-container">
            <div class="filter-group">
                <label for="search-name">Buscar por modelo</label>
                <input type="text" id="search-name" placeholder="Ex: Micropele, Lace...">
            </div>
            
            <div class="filter-group">
                <label>Faixa de Preço (R$)</label>
                <div class="price-inputs">
                    <input type="number" id="price-min" placeholder="Mín" min="0">
                    <span class="divider">até</span>
                    <input type="number" id="price-max" placeholder="Máx" min="0">
                </div>
            </div>

            <div class="filter-group view-toggle-group">
                <label>Visualização</label>
                <div class="view-toggle" role="group" aria-label="Modo de visualização">
                    <button class="view-btn" id="btn-view-grid" title="Grade" aria-pressed="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    </button>
                    <button class="view-btn" id="btn-view-list" title="Lista" aria-pressed="false">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <div id="product-grid" class="product-grid">
        </div>
    </main>

    <div id="product-modal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modal-img" src="" alt="Produto">
                </div>
                <div class="modal-details">
                    <h2 id="modal-title"></h2>
                    <p id="modal-description"></p>
                    <span id="modal-price" class="price-tag-large"></span>
                    <button class="btn-whatsapp" onclick="window.open('https://wa.me/5500999999999', '_blank')">
                        Consultar Disponibilidade
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Link discreto para o admin no rodapé -->
    <footer style="text-align:center; padding: 24px; border-top: 1px solid var(--border); margin-top: auto;">
        <a href="admin.html"
           style="font-size: 0.75rem; color: var(--text-muted); text-decoration: none; opacity: 0.4; transition: opacity 0.3s;"
           onmouseover="this.style.opacity='1'"
           onmouseout="this.style.opacity='0.4'">
            ⚙️ Área Administrativa
        </a>
    </footer>

    <script src="js/banco.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
